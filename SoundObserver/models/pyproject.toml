[project]
name = "acoustic-models"
version = "0.1.0"
description = "TinyML models for the urban acoustic sensor network: a DS-CNN sound classifier (urban-noise + safety heads) and unsupervised 'normal' anomaly detectors, targeting a sub-7-EUR MCU via TFLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
export = [
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoustic_models"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
